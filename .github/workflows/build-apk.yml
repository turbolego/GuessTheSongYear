name: Build & Release APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.versionName }}
      version_code: ${{ steps.version.outputs.versionCode }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        id: version
        run: |
          CURRENT_CODE=$(grep 'versionCode' app/build.gradle.kts | awk '{print $NF}')
          NEW_CODE=$((CURRENT_CODE + 1))
          CURRENT_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          MAJOR_MINOR=$(echo "$CURRENT_NAME" | sed -E 's/\.[0-9]+$//')
          NEW_NAME="${MAJOR_MINOR}.${NEW_CODE}"

          # bump in gradle
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            sed -i "s/versionCode = .*/versionCode = ${NEW_CODE}/" app/build.gradle.kts
            sed -i "s/versionName = \".*\"/versionName = \"${NEW_NAME}\"/" app/build.gradle.kts
            echo "Bumped to $NEW_NAME ($NEW_CODE)"
          else
            echo "PR — keeping versionCode=$CURRENT_CODE, versionName=$CURRENT_NAME"
          fi

          echo "versionCode=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "versionName=${NEW_NAME}" >> $GITHUB_OUTPUT

      # Commit & push the bump (only on master push, not PR)
      - name: Commit version bump
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --staged --quiet || git commit -m "chore: bump to v${{ steps.version.outputs.versionName }} [skip ci]"
          git push

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: debug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.versionName }}
          name: "v${{ needs.build.outputs.versionName }}"
          body: |
            ## 🎵 GuessTheSongYear v${{ needs.build.outputs.versionName }}

            Automatically built from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### 📱 Download
            - `app-release.apk` — minified release (smaller, optimized)
            - `app-debug.apk` — full debug build

            ### 🎮 Features
            - 🎯 Guess the release year of music videos
            - 📊 Points accuracy + streak multiplier
            - 🎮 Local multiplayer (same-device hot-seat)
            - 🎮 WiFi Direct multiplayer (host/join)
            - 🚫 Duplicate video prevention
            - 🔇 Audio-only mode (overlay hide video)
            - 🎨 3 difficulty levels (Easy, Medium, Hard)
            - 💡 Hints on Easy mode (decade + view count)
            - 🌓 Dark theme with amber accent

          draft: false
          files: |
            release/*.apk
            debug/*.apk
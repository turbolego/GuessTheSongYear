name: Build & Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for auto-version bump commit + push

    outputs:
      version_name: ${{ steps.version.outputs.versionName }}
      version_code: ${{ steps.version.outputs.versionCode }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        id: version
        run: |
          NEW_CODE=${{ github.run_number }}
          NEW_NAME="1.0.${NEW_CODE}"

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            sed -i "s/versionCode = .*/versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
            sed -i "s/versionName = .*/versionName = \"${NEW_NAME}\"/" app/build.gradle.kts
            echo "Bumped to $NEW_NAME ($NEW_CODE)"
          else
            echo "PR — keeping existing version"
          fi

          echo "versionCode=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "versionName=${NEW_NAME}" >> $GITHUB_OUTPUT

      # Commit & push the bump (only on master push, not PR)
      - name: Commit version bump
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --staged --quiet || git commit -m "chore: bump to v${{ steps.version.outputs.versionName }} [skip ci]"
          git push

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

  # ── Signed AAB (on master push only) ──────────────────────────────────
  aab:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/songguesser-upload-keystore.jks

      - name: Build AAB with Gradle
        env:
          STORE_FILE: app/keystore/songguesser-upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songguesser-release.aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for creating GitHub Release

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: debug

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.versionName }}
          name: "v${{ needs.build.outputs.versionName }}"
          body: |
            ## 🎵 GuessTheSongYear v${{ needs.build.outputs.versionName }}

            Automatically built from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### 📱 Download
            - `app-release.apk` — minified release (smaller, optimized)
            - `app-debug.apk` — full debug build

            ### 🎮 Features
            - 🎯 Guess the release year of music videos
            - 📊 Points accuracy + streak multiplier
            - 🎮 Local multiplayer (same-device hot-seat)
            - 🎮 WiFi Direct multiplayer (host/join)
            - 🚫 Duplicate video prevention
            - 🔇 Audio-only mode (overlay hide video)
            - 🎨 3 difficulty levels (Easy, Medium, Hard)
            - 💡 Hints on Easy mode (decade + view count)
            - 🌓 Dark theme with amber accent

          draft: false
          files: |
            release/*.apk
            debug/*.apk
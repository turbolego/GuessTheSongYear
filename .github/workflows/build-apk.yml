name: Build & Release APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version_name: ${{ steps.version.outputs.versionName }}
      version_code: ${{ steps.version.outputs.versionCode }}
      skip_release: ${{ steps.version.outputs.skipRelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)

          echo "version $CURRENT_NAME (code $CURRENT_CODE)"

          TAG="v${CURRENT_NAME}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Skip release: tag ${TAG} already exists"
            SKIP_RELEASE=true
          else
            SKIP_RELEASE=false
          fi

          echo "versionCode=${CURRENT_CODE}" >> "$GITHUB_OUTPUT"
          echo "versionName=${CURRENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "skipRelease=${SKIP_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB (unsigned)
        run: ./gradlew bundleRelease --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

  # ── Sign + upload to Play Store ─────────────────────────────────────────
  playstore:
    if: github.event_name != 'pull_request' && needs.build.outputs.skip_release == 'false'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          name: app-release
          path: app/build/outputs/bundle/release

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > .ci-keystore.jks

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.turbolego.songguesser
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          releaseName: ${{ needs.build.outputs.version_name }}

      - name: Upload signed AAB to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: app-release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: app-debug
          path: debug

      - name: Create tag and release
        if: needs.build.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: "v${{ needs.build.outputs.version_name }}"
          make_latest: true
          body: |
            ## 🎵 GuessTheSongYear v${{ needs.build.outputs.version_name }}

            Automatically built from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### 📱 Download
            - `app-release.apk` — minified release (smaller, optimized)
            - `app-debug.apk` — full debug build

            ### 🎮 Features
            - 🎯 Guess the release year of music videos
            - 📊 Points accuracy + streak multiplier
            - 🎮 Local multiplayer (same-device hot-seat)
            - 🎮 WiFi Direct multiplayer (host/join)
            - 🎮 Bluetooth multiplayer (host/join)
            - 🚫 Duplicate video prevention
            - 🔇 Audio-only mode (overlay hide video)
            - 🎨 3 difficulty levels (Easy, Medium, Hard)
            - 💡 Hints on Easy mode (decade + view count)
            - 🌓 Dark theme with amber accent

          draft: false
          files: |
            release/*.apk
            debug/*.apk

      - name: No new release needed
        if: needs.build.outputs.skip_release == 'true'
        run: |
          echo "Release skipped — tag v${{ needs.build.outputs.version_name }} already exists."
          echo "To create a new release, bump versionCode in app/build.gradle.kts and push."
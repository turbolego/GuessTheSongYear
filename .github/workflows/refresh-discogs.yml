name: Refresh Discogs Music List

on:
  schedule:
    - cron: '0 4 * * 2'  # Tuesday 04:00 UTC
  workflow_dispatch: {}

# Workflow-level: least privilege
permissions:
  contents: read

jobs:
  refresh-discogs:
    runs-on: ubuntu-latest
    # Job needs write for git push
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Discogs music list
        env:
          DISCOGS_CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
        run: |
          python scripts/refresh_discogs.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet app/src/main/assets/music_videos_discogs.txt 2>/dev/null; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/music_videos_discogs.txt
            git commit -m "chore: refresh Discogs music list ($(date +%Y-%m-%d))"
            git push
          fi
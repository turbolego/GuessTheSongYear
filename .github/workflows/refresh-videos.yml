name: Refresh Music Video Database

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Allow manual trigger

# Workflow-level: least privilege
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job needs write for git push
    permissions:
      contents: write
      id-token: none
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Refresh video database
        run: python scripts/refresh_videos.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet app/src/main/assets/music_videos.txt \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/music_videos.txt
          git commit -m "chore: refresh music video database [automated]"
          git push